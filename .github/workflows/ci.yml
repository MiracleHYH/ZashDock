name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS 26 / arm64
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify toolchain and architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
          sdk_version=$(xcrun --sdk macosx --show-sdk-version)
          test "${sdk_version%%.*}" -ge 26

      - name: Test Core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/verification
          Scripts/test-core.sh 2>&1 | tee build/verification/ci-core.log

      - name: Verify release signing profiles
        shell: bash
        run: Scripts/test-release-profiles.sh

      - name: Build and test the sandboxed App
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ZashDock.xcodeproj -scheme ZashDock \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/Xcode -resultBundlePath build/CI-tests.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES test \
            2>&1 | tee build/verification/ci-xcodebuild.log

      - name: Verify WebKit persistence across app processes
        shell: bash
        run: |
          set -euo pipefail
          Scripts/test-storage-processes.sh 2>&1 | tee build/verification/ci-storage-processes.log

      - name: Verify AppModel restart after a committed port change
        shell: bash
        run: |
          set -euo pipefail
          Scripts/test-appmodel-processes.sh 2>&1 | tee build/verification/ci-appmodel-processes.log

      - name: Package the Debug App
        shell: bash
        run: |
          set -euo pipefail
          # Build separately so the distributed development App has no XCTest plug-in.
          xcodebuild -project ZashDock.xcodeproj -scheme ZashDock \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/DebugApp \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES build
          app=build/DebugApp/Build/Products/Debug/ZashDock.app
          codesign --verify --deep --strict "$app"
          test "$(lipo -archs "$app/Contents/MacOS/ZashDock")" = arm64
          ditto -c -k --sequesterRsrc --keepParent "$app" build/ZashDock-arm64-Debug.zip

      - name: Upload Debug App
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ZashDock-arm64-Debug-${{ github.sha }}
          path: build/ZashDock-arm64-Debug.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ github.sha }}
          path: |
            build/verification/ci-core.log
            build/verification/ci-xcodebuild.log
            build/verification/ci-storage-processes.log
            build/verification/ci-appmodel-processes.log
            build/verification/storage-processes.*/
            build/verification/appmodel-processes.*/
            build/CI-tests.xcresult
          if-no-files-found: warn
          retention-days: 7
